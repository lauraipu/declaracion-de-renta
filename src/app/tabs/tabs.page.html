<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="tab1" href="/tabs/tab1">
      <ion-icon aria-hidden="true" name="scan-outline"></ion-icon>
      <ion-label>Registrar</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab2" href="/tabs/tab2">
      <ion-icon aria-hidden="true" name="wallet-outline"></ion-icon>
      <ion-label>Mes Actual</ion-label>
      @if (mostrarBadge()) {
        <ion-badge color="rosa" [attr.aria-label]="porcentaje() + ' por ciento del presupuesto usado'">
          {{ porcentaje() >= 100 ? '!' : porcentaje() + '%' }}
        </ion-badge>
      }
    </ion-tab-button>

    <ion-tab-button tab="tab3" href="/tabs/tab3">
      <ion-icon aria-hidden="true" name="document-text-outline"></ion-icon>
      <ion-label>Renta Anual</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
